<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>alignment notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color: purple;
                color: white;
                text-align: center;
                /* margin: 0 auto;*/
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            button{
                margin-top: 25px;
                padding: 25px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
            }
            img{
                width: 200px;
            }
        </style>
    </head>
    <body>
        <h1> Alignment Notes</h1>
        <img src="link" alt="timp" id="timp" onmouseout="rotate()">
        <div id="grid-wrapper">
            <div id="box" onmouseover="showHide()">
                <p id="text"> Show More</p>
            </div>
                <div id="box">
                <p> box 2</p>
            </div>
                <div id="box">
                <p> box 3</p>
            </div>
                <div id="box">
                <p> box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p> box 1</p>
            </div>
                <div id="box">
                <p> box 2</p>
            </div>
                <div id="box">
                <p> box 3</p>
            </div>
                <div id="box">
                <p> box 4</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <br>
        <button onclick="changeColor()">Click Me!</button>

        <script>
            let images = ["link1", "link2", "link3","link"]
            let currentImage = 0
            function rotate(){
                    if currentImage > 3 {currentImage = 0}
                    currentImage += 1
                    document.getElementById("timp").src = images[currentImage]
                    
            }
            function changeColor(){
                let currentColor = document.getElementById("newColor").value
                document.getElementById("box").style.backgroundColor = currentColor
            }
            function showHide(){
                let item=document.getElementById("flex-wrapper")
                if(item.style.display == "flex"){
                    item.style.display = "none"
                    document.getElementById("text").innerHTML = "Show More"
                }else{
                    item.style.display="flex" //block,flex,none,grid//
                    document.getElementById("text").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
