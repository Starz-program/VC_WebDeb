<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Basic Website</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Name of website</h1>
        <p><span id="important">Paragraph tags</span> are used to <span id="attention">display mort of the text on the website. </span></p>
        <p>We start new paragraph tag when we want a new <span id="italics"> paragraph on the page.</span> <br> This way things are easy to read.</p>
    </body>
</html>


<style>
    /*Cascading style sheets
    1. Selector=> says what to change
    2.Declaration=> 1 instruction of something to change
        a. Property => What about the element to change
        b. Value => How to change it*/
        body{
            color:olive;
            background-color:rgb(216, 211, 183);
            border: inset 5px #3b5037;
            font-family: 'comic sans', cursive;
            font-weight: 100;
            font-style: oblique;

        }
         h1{
            text-align: center;
         }
        #even{
            color:rgb(196, 101, 33);
            text-decoration: underline;
            font-weight: 100;
            font-style: italic;
        }
        .lists{
            width: 50%;
            border-radius: 5px;
            background-color: rgb(43, 38, 30);
        }
        #important{
            text-decoration: underline;
            color: green;
        }
        #attention{
            font-weight: bold;
        }
        #italics{
            font-style: italic;
        }
</style>
<body>
    <h1>HTML advanced notes</h1>
    <div class="lists">
    <h3>Lists:</h3>
    <ul>
        <li id="even">hello</li>
        <li>hi</li>
        <li>hola</li>
    </ul>
    <ol>
        <li>haha</li>
        <li>jaja</li>
        <li>jajsjs</li>
    </ol>
    </div>
</body>

</html>
